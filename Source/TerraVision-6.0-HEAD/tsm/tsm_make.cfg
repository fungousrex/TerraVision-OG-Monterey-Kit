# system dependent variables for xshell build

TARGETS     = all debug profile optimize depend clean

# Unconditional Macros
MAKEDEPEND  = makedepend
G_C++FLAGS  =
C++FLAGS    = -DXTFUNCPROTO -DFUNCPROTO
X11INCDIR   = 
X11LIBDIR   =
TARFLAGS    = cvf
ARFLAGS     = rv
MDFLAGS     = -Dsgi
RANLIB      =
LINTFLAG    = $(INCLUDE) -DXTFUNCPROTO -DFUNCPROTO -v -u -z
TAR         = @tar
MV          = -mv
RM          = -rm -f
CC          = cc
LINT        = lint

# Conditional Macros
G_LDFLAGS = 
G_CFLAGS = -DXTFUNCPROTO -DFUNCPROTO -fullwarn

##ifndef $(OPTFLAGS)
OPTFLAGS = -g
##endif

# These Unconditional Macros generally won't change
SOURCE         = $(SOURCE.cxx) \
                 $(SOURCE.c)
OBJECTS        = $(SOURCE.cxx:.cxx=.o) \
                 $(SOURCE.c:.c=.o)

# Suffix Rules
.SUFFIXES:
.SUFFIXES:	.o .cxx .cxx~ .C .C~ .c .c~ .h .x

.cxx.o:
	$(CC) $(INCLUDE) $(G_C++FLAGS) $(C++FLAGS) $(OPTFLAGS) $(G_CFLAGS) $(CFLAGS) -c $<

.C.o:
	$(CC) $(INCLUDE) $(G_C++FLAGS) $(C++FLAGS) $(OPTFLAGS) $(G_CFLAGS) $(CFLAGS) -c $<

.c.o:
	$(CC) $(INCLUDE) $(G_CFLAGS) $(OPTFLAGS) $(CFLAGS) -c $<

.x.h:
	rpcgen -P $<

CLEAN_O= \
	for i in *.o; do \
	  if [ -w $$i ]; then rm -f $$i; fi \
	done
